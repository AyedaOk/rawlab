name: Linux build and tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install FOSS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config g++ \
            qt6-base-dev qt6-base-dev-tools qt6-image-formats-plugins qt6-wayland \
            libraw-dev libtiff-dev libpng-dev liblensfun-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned ONNX Runtime headers
        run: |
          mkdir -p "$RUNNER_TEMP/onnx-include"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/microsoft/onnxruntime/v1.20.1/include/onnxruntime/core/session/onnxruntime_c_api.h \
            --output "$RUNNER_TEMP/onnx-include/onnxruntime_c_api.h"
      - name: Configure
        run: cmake --preset dev -DONNXRuntime_INCLUDE_DIR="$RUNNER_TEMP/onnx-include"
      - name: Build
        run: cmake --build --preset dev --parallel 2
      - name: Test (no model downloads required)
        run: ctest --preset dev
      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Build and test desktop
        working-directory: desktop
        env:
          RAWLAB_ENGINE_SOURCE: ../build/dev/src/rawlab_preview/rawlab-preview
        run: |
          npm run desktop:prepare
          npm run build
          npm test -- --workers=2
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Keep test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build/dev/Testing/Temporary/
            desktop/test-results/
