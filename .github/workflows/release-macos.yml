name: macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: brew install cmake ninja pkg-config qt libraw libtiff libpng lensfun dylibbundler

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ONNX Runtime CPU
        run: |
          curl -L --fail -o /tmp/onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-osx-arm64-1.20.1.tgz
          tar -xzf /tmp/onnxruntime.tgz -C /tmp

      - name: Build native worker
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
        run: |
          onnx=/tmp/onnxruntime-osx-arm64-1.20.1
          onnxlib="$(ls "$onnx"/lib/libonnxruntime*.dylib | head -1)"
          cmake --preset release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DRAWLAB_DEPENDENCY_ROOT="$onnx" \
            -DONNXRuntime_INCLUDE_DIR="$onnx/include" \
            -DONNXRuntime_LIBRARY="$onnxlib"
          cmake --build --preset release --parallel 2

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage macOS runtime
        env:
          ONNXRUNTIME_LIB_DIR: /tmp/onnxruntime-osx-arm64-1.20.1/lib
          LENSFUN_DATA_DIR: /opt/homebrew/share/lensfun
        run: bash scripts/stage-tauri-macos.sh

      - name: Build DMG
        working-directory: desktop
        run: npm run desktop:bundle:macos -- --config src-tauri/bundle/macos-deployment.json

      - name: Validate bundle
        run: |
          set -euo pipefail
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          echo "--- Contents/MacOS ---"
          ls -la "$app/Contents/MacOS"
          echo "--- Contents/Resources ---"
          ls -la "$app/Contents/Resources"
          test -x "$app/Contents/MacOS/rawlab-preview"
          test -x "$app/Contents/MacOS/rawlab-desktop" || test -x "$app/Contents/MacOS/RawLab"
          ls "$app/Contents/Resources"/libonnxruntime*.dylib
          test -f "$app/Contents/Resources/lensfun/version_1/timestamp.txt"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"
          python3 - "$app" <<'PY'
          import pathlib, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          worker = app / 'Contents/MacOS/rawlab-preview'
          signature = subprocess.run(['codesign', '-dv', '--verbose=4', str(worker)],
              capture_output=True, text=True, check=True).stderr
          assert 'Signature=adhoc' in signature, signature
          assert 'runtime)' not in signature and ',runtime,' not in signature, signature
          for path in app.rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              if 'Mach-O' not in subprocess.check_output(['file', '-b', str(path)], text=True):
                  continue
              links = subprocess.check_output(['otool', '-L', str(path)], text=True)
              for line in links.splitlines()[1:]:
                  dependency = line.strip().split(' (')[0]
                  if dependency.startswith('/') and not dependency.startswith(('/System/Library/', '/usr/lib/')):
                      raise SystemExit(f'External dependency: {path}: {dependency}')
          result = subprocess.run([str(app / 'Contents/MacOS/rawlab-preview'), '--serve'],
              input='{"operation":"settings"}\n', text=True, capture_output=True, timeout=30)
          assert result.returncode == 0, result.stderr
          import json
          response = json.loads(result.stdout)
          assert 'error' not in response, response
          print('Packaged worker settings request passed')
          import os
          environment = dict(os.environ, QT_PLUGIN_PATH=str(app / 'Contents/Resources/qt-plugins'))
          result = subprocess.run([str(worker), '--serve'], input='{"operation":"catalog"}\n',
              text=True, capture_output=True, timeout=60, env=environment)
          assert result.returncode == 0, result.stderr
          responses = [json.loads(line) for line in result.stdout.splitlines()]
          assert responses and 'catalog' in responses[-1] and responses[-1]['catalog'], (result.stdout, result.stderr)
          print('Packaged worker HTTPS catalog request passed')
          PY
          hdiutil detach "$mount" -quiet

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: rawlab-macos-arm64
          retention-days: 7
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
