name: Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            liblensfun-dev \
            libpng-dev \
            libraw-dev \
            librsvg2-dev \
            libssl-dev \
            libtiff-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            ninja-build \
            patchelf \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ONNX Runtime CPU
        run: |
          curl -L --fail -o /tmp/onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          tar -xzf /tmp/onnxruntime.tgz -C /tmp

      - name: Build native worker
        run: |
          cmake --preset release \
            -DRAWLAB_DEPENDENCY_ROOT=/tmp/onnxruntime-linux-x64-1.20.1 \
            -DONNXRuntime_INCLUDE_DIR=/tmp/onnxruntime-linux-x64-1.20.1/include \
            -DONNXRuntime_LIBRARY=/tmp/onnxruntime-linux-x64-1.20.1/lib/libonnxruntime.so
          cmake --build --preset release --parallel 2

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage AppImage runtime
        env:
          ONNXRUNTIME_LIB_DIR: /tmp/onnxruntime-linux-x64-1.20.1/lib
        run: bash scripts/stage-tauri-linux.sh

      - name: Build AppImage
        working-directory: desktop
        run: npm run desktop:bundle:linux

      - name: Validate AppImage runtime
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1
          appimage="$(realpath "${appimages[0]}")"
          extract_dir=/tmp/rawlab-appimage-check
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          test -x "$extract_dir/squashfs-root/usr/bin/rawlab-desktop"
          test -x "$extract_dir/squashfs-root/usr/bin/rawlab-preview"
          test -f "$extract_dir/squashfs-root/usr/lib/libonnxruntime.so.1.20.1"
          test -x "$extract_dir/squashfs-root/usr/lib/$multiarch/webkit2gtk-4.1/WebKitNetworkProcess"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: rawlab-linux-x86_64
          retention-days: 7
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
