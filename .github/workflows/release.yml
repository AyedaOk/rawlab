name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libraw-dev \
            libtiff-dev \
            libpng-dev
      - name: Install ONNX Runtime CPU
        run: |
          curl -L --fail -o /tmp/onnxruntime.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
      - name: Configure and build
        run: >-
          cmake --preset release
          -DRAWLAB_DEPENDENCY_ROOT=/tmp/onnxruntime-linux-x64-1.20.1
          -DONNXRuntime_INCLUDE_DIR=/tmp/onnxruntime-linux-x64-1.20.1/include
          -DONNXRuntime_LIBRARY=/tmp/onnxruntime-linux-x64-1.20.1/lib/libonnxruntime.so
          && cmake --build --preset release
      - name: Package
        run: QMAKE=/usr/bin/qmake6 bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: mac
          target: desktop
          arch: clang_64
          install-deps: true
      - name: Install dependencies
        run: brew install pkg-config libraw libtiff libpng
      - name: Install ONNX Runtime CPU
        run: |
          curl -L --fail -o /tmp/onnxruntime.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-osx-arm64-1.20.1.tgz
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
      - name: Configure and build
        run: >-
          cmake --preset release
          -DRAWLAB_DEPENDENCY_ROOT=/tmp/onnxruntime-osx-arm64-1.20.1
          -DONNXRuntime_INCLUDE_DIR=/tmp/onnxruntime-osx-arm64-1.20.1/include
          -DONNXRuntime_LIBRARY=/tmp/onnxruntime-osx-arm64-1.20.1/lib/libonnxruntime.dylib
          && cmake --build --preset release
      - name: Package
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          install-deps: true
      - name: Install vcpkg dependencies
        shell: pwsh
        run: vcpkg install libraw tiff libpng --triplet x64-windows
      - name: Install ONNX Runtime CPU
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "onnxruntime.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Rename-Item (Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-1.20.1") (Join-Path $env:RUNNER_TEMP "onnx")
      - name: Configure and build
        shell: pwsh
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DRAWLAB_DEPENDENCY_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows
          -DONNXRuntime_INCLUDE_DIR=$env:RUNNER_TEMP/onnx/include
          -DONNXRuntime_LIBRARY=$env:RUNNER_TEMP/onnx/lib/onnxruntime.lib
          -DQt6_DIR=$env:Qt6_DIR
          && cmake --build build/release
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
