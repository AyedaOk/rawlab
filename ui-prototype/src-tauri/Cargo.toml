[package]
name = "rawlab-desktop-preview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RawLab React desktop preview"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
